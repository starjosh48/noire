<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1000" width="2400" height="1000" role="img" aria-label="A NOIRÉ flacon under a single spotlight">
<title>A NOIRÉ flacon under a single spotlight</title>
<defs>
    <linearGradient id="wall-703" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#595756"/>
      <stop offset="1" stop-color="#2A2826"/>
    </linearGradient>
    <linearGradient id="ground-704" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242321"/>
      <stop offset="1" stop-color="#1e1d1b"/>
    </linearGradient>
    <radialGradient id="glow-705" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient><radialGradient id="spot-702" cx="0.7" cy="0.45" r="0.35">
            <stop offset="0" stop-color="#F4E9D6" stop-opacity="0.32"/>
            <stop offset="1" stop-color="#F4E9D6" stop-opacity="0"/></radialGradient>
    
    <linearGradient id="edge-706" x1="0" x2="1">
      <stop offset="0" stop-color="#937175"/>
      <stop offset="0.08" stop-color="#d5c1c3"/>
      <stop offset="0.5" stop-color="#c8aeb1"/>
      <stop offset="0.92" stop-color="#d2bdbf"/>
      <stop offset="1" stop-color="#876468"/>
    </linearGradient>
    <linearGradient id="liquid-707" x1="0" x2="1">
      <stop offset="0" stop-color="#4b1d22"/>
      <stop offset="0.18" stop-color="#6E2B32"/>
      <stop offset="0.46" stop-color="#885157"/>
      <stop offset="0.78" stop-color="#6E2B32"/>
      <stop offset="1" stop-color="#421a1e"/>
    </linearGradient>
    <linearGradient id="liquidV-708" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="base-709" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#926065"/>
      <stop offset="0.35" stop-color="#c8aeb1"/>
      <stop offset="1" stop-color="#8f676b"/>
    </linearGradient>
    <linearGradient id="collar-710" x1="0" x2="1">
      <stop offset="0" stop-color="#7D6C52"/>
      <stop offset="0.22" stop-color="#E9DCC0"/>
      <stop offset="0.45" stop-color="#A08B68"/>
      <stop offset="0.7" stop-color="#F3EAD6"/>
      <stop offset="1" stop-color="#6E5E46"/>
    </linearGradient>
    <linearGradient id="cap-711" x1="0" x2="1">
      <stop offset="0" stop-color="#0E0D0C"/>
      <stop offset="0.18" stop-color="#2E2B29"/>
      <stop offset="0.34" stop-color="#4A4643"/>
      <stop offset="0.5" stop-color="#22201E"/>
      <stop offset="1" stop-color="#0B0A09"/>
    </linearGradient>
    <linearGradient id="hl-712" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.85" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-713"><rect x="0" y="232" width="420" height="568" rx="34"/></clipPath>
    <filter id="blur-714" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blurSoft-715" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="18.2"/></filter>
    <linearGradient id="fade-716" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mask-717"><rect x="1523" y="860" width="314" height="560" fill="url(#fade-716)"/></mask>
    <g id="bottle-718">
    <!-- cap -->
    <rect x="105" y="0" width="210" height="192" rx="5" fill="url(#cap-711)"/>
    <rect x="105" y="0" width="210" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
    <rect x="132" y="14" width="10" height="168" fill="#ffffff" opacity="0.06"/>
    <!-- collar -->
    <rect x="140" y="190" width="140" height="44" fill="url(#collar-710)"/>
    <rect x="140" y="190" width="140" height="3" fill="#000" opacity="0.25"/>
    <!-- body: thick glass walls around the juice -->
    <rect x="0" y="232" width="420" height="568" rx="34" fill="url(#edge-706)"/>
    <g clip-path="url(#clip-713)">
      <rect x="20" y="278" width="380" height="438" rx="16" fill="url(#liquid-707)"/>
      <rect x="20" y="278" width="380" height="438" rx="16" fill="url(#liquidV-708)"/>
      <rect x="20" y="278" width="380" height="5" fill="#af8a8e" opacity="0.9"/>
      <rect x="0" y="716" width="420" height="84" fill="url(#base-709)"/>
      <rect x="20" y="716" width="380" height="2" fill="#532026" opacity="0.5"/>
      <rect x="30" y="252" width="22" height="532" fill="url(#hl-712)"/>
      <rect x="64" y="262" width="56" height="510" fill="url(#hl-712)" opacity="0.18"/>
      <rect x="388" y="256" width="7" height="520" fill="url(#hl-712)" opacity="0.55"/>
      <rect x="0" y="232" width="420" height="4" fill="#ffffff" opacity="0.5"/>
    </g>
    <!-- label -->
    <g transform="translate(70 404)">
      <rect width="280" height="186" fill="#F5F0E8"/>
      <rect x="8" y="8" width="264" height="170" fill="none" stroke="#1A1918" stroke-opacity="0.18" stroke-width="1"/>
      <text x="140" y="56" text-anchor="middle" font-family="Didot, 'Bodoni 72', 'Bodoni MT', 'Times New Roman', Georgia, serif" font-size="34" letter-spacing="9" fill="#1A1918">NOIRÉ</text>
      <rect x="122" y="74" width="36" height="1" fill="#1A1918" opacity="0.5"/>
      <text x="140" y="118" text-anchor="middle" font-family="Didot, 'Bodoni 72', 'Bodoni MT', 'Times New Roman', Georgia, serif" font-size="34" font-style="italic" fill="#1A1918">11</text>
      <text x="140" y="146" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4.2" fill="#1A1918">ROSE NOIR</text>
      <text x="140" y="166" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="2.6" fill="#1A1918" opacity="0.6">EXTRAIT DE PARFUM</text>
    </g></g></defs>

    <rect width="2400" height="1000" fill="url(#wall-703)"/>
    <rect y="780" width="2400" height="220" fill="url(#ground-704)"/>
    <rect width="2400" height="1000" fill="url(#glow-705)"/><rect width="2400" height="1000" fill="url(#spot-702)"/>
    <polygon filter="url(#blurSoft-715)" fill="#000" opacity="0.16"
      points="1540,860 1820,860 1988.7,827.8 1812.3,823.6"/><ellipse cx="1803.48" cy="872.6" rx="147" ry="18.2" fill="#6E2B32" opacity="0.32" filter="url(#blurSoft-715)"/><ellipse cx="1680" cy="861.4" rx="164.64000000000001" ry="11.2" fill="#000" opacity="0.32" filter="url(#blur-714)"/><g mask="url(#mask-717)"><use href="#bottle-718" transform="translate(1533 1420) scale(0.7 -0.7) translate(0 0)"/></g><use href="#bottle-718" transform="translate(1533 300) scale(0.7)"/>
</svg>